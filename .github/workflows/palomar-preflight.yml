# Palomar mechanical preflight (advisory; NOT a submission).
# Runs Palomar's own verifier at a pinned PalomarSubmission commit against this
# repository at the triggering commit. Manual trigger only.
#
# Preconditions it cannot satisfy by itself:
#   - the repository must be public (Palomar fetches it anonymously);
#   - see palomar/README.md for the full checklist.
# Known upstream issue: PalomarRegistry/PalomarSubmission#154 (preflight may
# skip verification steps) was open on 2026-10-15.
name: Palomar preflight

on:
  workflow_dispatch:

jobs:
  palomar-preflight:
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
    with:
      repository: ${{ github.repository }}
      commit: ${{ github.sha }}
      pipeline_commit: d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
      request_id: preflight001
      mode: full
      options: '{"project_path":"palomar","comparator_config_path":"palomar/comparator.json","formalization_metadata_path":"palomar/formalization.yaml","authorization_relationship":"I am a responsible author or maintainer"}'
