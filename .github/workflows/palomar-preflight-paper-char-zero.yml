# Palomar mechanical preflight for the lean/paper-char-zero entry
# (advisory; NOT a submission). Runs Palomar's own verifier at a pinned
# PalomarSubmission commit against this repository at the triggering commit.
# Manual trigger only.
#
# Palomar's agent protocol (submit.palomar-registry.org/llms.txt): submit only
# when this reports `status: pass`.
name: Palomar preflight (paper-char-zero)

on:
  workflow_dispatch:

jobs:
  palomar-preflight:
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@14aa8d6b3c2f14a8540605e37144560b9a00e7e7
    with:
      repository: ${{ github.repository }}
      commit: ${{ github.sha }}
      pipeline_commit: 14aa8d6b3c2f14a8540605e37144560b9a00e7e7
      request_id: pczeropre001
      mode: full
      execution_profile: palomar-standard-v1
      options: '{"project_path":"lean/paper-char-zero","comparator_config_path":"lean/paper-char-zero/comparator.json","formalization_metadata_path":"lean/paper-char-zero/formalization.yaml","authorization_relationship":"I am a responsible author or maintainer"}'
