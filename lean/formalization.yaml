# Palomar metadata for the `PCF all the way down` Lean development.
# Format: mathlib-initiative formalization.yaml v0.4, with Palomar's mandatory
# additions (see PalomarRegistry/PalomarPolicy CONTRIBUTING.md, section 3).
#
# Prepared, not submitted. Facts about people and process were confirmed by
# Taylor on 2026-10-15.

version: v0.4

project:
  name: "PCF all the way down in characteristic zero"
  description: |
    A Lean 4 / Mathlib formalization of the characteristic-zero case of the
    "PCF all the way down" theorem (Corollary cor:pcfawd of the manuscript,
    which contains Theorem thm:general as its first step).

    Let k be a field of characteristic zero, X an integral, locally Noetherian
    scheme with Noetherian underlying space, locally of finite type over k, and
    f : X → X a finite dominant morphism of schemes (f is not required to be a
    k-morphism, and X is not required to be separated). Ramification is
    measured on the normalization X̃ of X (Mathlib's normalization of X in its
    function field): the unique lift g of f has post-critical set
    {g^(n+1)(x) : n ≥ 0, x a codimension-one point whose stalk map has
    ramification index > 1}, and f is "normalized PCF" if this set is finite.
    The compared theorem `Pcf.Palomar.pcfAllTheWayDown_charZero_unconditional`
    concludes that a normalized-PCF f is PCF all the way down: for every depth
    d, f is normalized PCF and, for every point y = f^r(x) with x of
    codimension one and f^p(y) = y for some p ≥ 1, the restriction of f^p to
    the reduced closure of y is PCF all the way down to depth d − 1. Two
    further compared theorems, `Pcf.Palomar.existsUnique_isNormalizationLift`
    and `Pcf.Palomar.exists_pointClosure_restriction`, show that the lift to
    the normalization and the restrictions quantified over in these
    definitions exist (and are unique), so the definitions are not vacuous.

    The theorem has no hypotheses beyond those displayed. The two classical
    results the manuscript cites, Zariski–Nagata purity of the branch locus
    (Stacks Project Tag 0BMB) and Abhyankar's lemma for a regular divisor
    (Tags 0EYG/0EYH, in the case where every positive integer is invertible),
    are proved in the submitted development in affine forms and used in the
    proof; they are not hypotheses of the compared theorem. The proof uses
    only the axioms propext, Classical.choice and Quot.sound. At depth zero
    the conclusion restates the hypothesis, and the depth is not bounded by
    the dimension of X.
  authors:
    # Taylor 2026-10-17: Alon Levy is an author of the manuscript, not of the
    # formalization.
    - Taylor Dupuy
    - Thomas Tucker
    - Zhuoran Wang
  license: Apache-2.0
  responsible_maintainers:
    - Taylor Dupuy

classification:
  arxiv: ["math.DS", "math.AG", "math.NT"]
  msc2020: ["37P55", "14E22"]  # quoted: YAML 1.2 reads 14E22 as a float

sources:
  - title: "PCF all the way down"
    type: paper
    authors: [Taylor Dupuy, Alon Levy, Thomas Tucker, Zhuoran Wang]
    # No arXiv identifier yet (Taylor, 2026-10-15). Replace this when posted.
    # The manuscript is not in the submission repository until it is posted.
    identifier: "Manuscript in preparation; not yet public"
    relationship: adapts
    author_endorsement: participated
    note: >
      Formalizes Theorem A / Corollary cor:pcfawd of the manuscript in its
      characteristic-zero form. Zariski–Nagata purity and Abhyankar's lemma,
      which the manuscript cites, are proved in the development rather than
      cited. Varieties are encoded as integral, locally Noetherian,
      Noetherian-space schemes locally of finite type over k, without
      separatedness, and f is not required to be a k-morphism.
  - title: "Finite ramification for preimage fields of post-critically finite morphisms"
    type: paper
    authors: [Andrew Bridy, Patrick Ingram, Rafe Jones, Jamie Juul, Alon Levy, Michelle Manes, Simon Rubinstein-Salzedo, Joseph H. Silverman]
    identifier: "Math. Res. Lett. 24 (2017), no. 6, 1633–1647; arXiv:1511.00194"
    relationship: background
    note: The PCF-all-the-way-down conjecture is quoted on page 2 of this paper.
  - title: "The Stacks Project, Tags 0BMB (purity of branch locus), 0EYG and 0EYH (Abhyankar's lemma)"
    type: book
    identifier: "https://stacks.math.columbia.edu/tag/0BMB"
    relationship: background
    note: >
      The two classical results used in the proof. Affine forms of both are
      proved in the development (`Pcf.Stacks.zariskiNagataPurity`,
      `Pcf.Stacks.abhyankarLemma`, the latter when every positive integer is
      invertible); they do not appear in the compared statement.

automation:
  methods:
    # Confirmed by Taylor 2026-10-15.
    - method: agent
      tool_setup: >
        Claude Code CLI with Anthropic Claude Opus models (Opus 5, Opus 5.5),
        driven by the `using-leanpowers` skill suite
        (https://github.com/tdupu/agent-skills-public, skills/using-leanpowers),
        which builds on Chris Birkbeck's mathlib-quality Claude Code plugin
        (https://github.com/CBirkbeck/mathlib-quality).
      notes: >
        The Lean development was written by AI agents under the direction of
        the authors. The authors keep a per-task record of AI use privately;
        it is not part of the submitted repository.

review:
  # Confirmed by Taylor 2026-10-15: agents reviewed the statements.
  status: agent-reviewed
  notes: >
    Statement fidelity was audited by agents against the manuscript. The
    2026-10-15 pass (lean-fidelity skill, Claude Opus 5.5) reviewed
    the Challenge (then palomar/PcfChallenge.lean, now lean/PcfChallenge.lean)
    definition by definition against the
    manuscript and Stacks 0BMB/0EYF/0EYG/0EYH and approved it: the statement
    faithfully formalizes cor:pcfawd and is slightly more general (no
    separatedness; f need not be a k-morphism). At that time the compared
    theorem took purity and Abhyankar's lemma as hypotheses. The 2026-10-17
    pass (Claude Opus 5.5) checked the present Challenge: its compared
    theorem is the reviewed statement with those two hypotheses removed, and
    every definition it uses is textually unchanged from the reviewed
    Challenge. The Challenge and Solution environments agree on the types and
    definition bodies (structural hashes) of all 4976 constants the compared
    statements depend on. No human author has reviewed the statement. See
    also lean/PALOMAR.md and lean/AXIOMS.md.
