version: v0.4

project:
  name: "Characteristic-zero divisor restriction and PCF all the way down"
  description: |
    The characteristic-zero headline statements of the manuscript
    "PCF all the way down": Theorem A (thm:A, equivalently thm:general)
    and Corollary cor:pcfawd. Let k be a field of characteristic zero,
    X an integral, locally Noetherian scheme with Noetherian underlying
    space, locally of finite type over k, and f a finite dominant endomorphism.
    The endomorphism need not be over k, and separatedness is not assumed.

    Normalized PCF means that the lift to the normalization has only finitely
    many points in the forward images of ramified codimension-one points;
    ramification is measured by the stalk ramification index. Theorem A says
    that, if f is normalized PCF, every return of an iterate of f to the
    reduced closure of a periodic point in the forward orbit of a
    codimension-one point is normalized PCF. The corollary proves normalized
    PCF at every finite depth of these successive divisor returns.

    The selected declarations PaperCharZero.Palomar.theoremA and
    PaperCharZero.Palomar.cor_pcfawd are proved through explicit statement
    equivalences from PaperCharZero.theoremA and PaperCharZero.cor_pcfawd.
    Two additional selected theorems establish existence and uniqueness of
    normalization lifts and existence of point-closure restrictions, so the
    quantified definitions are nonvacuous. Restriction uniqueness follows
    from the closed immersion. Purity and Abhyankar inputs are proved in
    the development, not additional assumptions of these statements.

    These four declarations are the selected results of this entry. They do
    not claim any characteristic-p theorem. The same Lake project also
    imports and builds, but does not select, formalizations of the
    manuscript's bounding theorem (thm:bounding, with its literal exceptional
    set), its supporting lemmas, the source-shaped Abhyankar and purity
    statements, and its examples ex:squaring-PN, ex:koch, ex:dupont,
    ex:pinched, ex:cusp, ex:smooth-restriction, ex:branch-singular and
    ex:branch-sing-B; see palomar-package.md for their modeling choices.
    Those additional results are not part of the compared statement.
  authors:
    - Taylor Dupuy
    - Thomas Tucker
    - Zhuoran Wang
  license: Apache-2.0
  responsible_maintainers:
    - Taylor Dupuy

