version: v0.4

project:
  name: "PCF all the way down"
  description: |
    Let k be a field of characteristic zero and let f: X → X be a finite surjective map of integral k-schemes of finite type. By the critical locus of f we mean the image in X of the critical locus of the map induced on the normalization of X. By the branch locus we mean the image of the critical locus under f.

    We say that f is post-critically finite (PCF) if, for every irreducible divisor D contained in the branch locus, the forward orbit f(D) ∪ f^2(D) ∪ … is algebraic, that is, a finite union of subvarieties, taken as a closed subscheme with its reduced induced structure.

    We prove that if f is PCF and A is a preperiodic divisor for f with f^{r+s}(A) = f^r(A), then, setting B = f^r(A) and g = f^s, the restriction of g to B is PCF.

    This proves the PCF all the way down conjecture: restricting again to preperiodic divisors and iterating gives PCF maps at every stage.
  authors:
    - Taylor Dupuy
    - Thomas Tucker
    - Zhuoran Wang
  license: Apache-2.0
  responsible_maintainers:
    - Taylor Dupuy

classification:
  arxiv: ["math.DS", "math.AG", "math.NT"]
  msc2020: ["37P55", "14E22"]

sources:
  - title: "PCF all the way down"
    type: paper
    authors: [Taylor Dupuy, Alon Levy, Thomas Tucker, Zhuoran Wang]
    identifier: "Manuscript in preparation; not yet public"
    relationship: adapts
    author_endorsement: participated
    note: >
      Theorem thm:A (equivalently thm:general) and Corollary cor:pcfawd of
      the characteristic-zero manuscript. The selected declarations are
      PaperCharZero.Palomar.theoremA and PaperCharZero.Palomar.cor_pcfawd,
      proved through explicit statement equivalences from
      PaperCharZero.theoremA and PaperCharZero.cor_pcfawd, together with
      PaperCharZero.Palomar.existsUnique_isNormalizationLift and
      PaperCharZero.Palomar.exists_pointClosure_restriction, which show that
      the quantified definitions are nonvacuous. The Lean statement is more
      general than the abstract: X is integral, locally Noetherian with
      Noetherian underlying space and locally of finite type over k, the
      endomorphism is finite and dominant and need not be a morphism over k,
      and separatedness is not assumed. PCF is normalized PCF: finiteness of
      the forward images of the ramified codimension-one points of the lift to
      the normalization, with ramification measured by the stalk
      ramification index; it is proved equivalent to the definition above.
      Purity and Abhyankar inputs are proved in the development, not assumed.
      The same project also builds, but does not select, the bounding theorem
      thm:bounding, the supporting lemmas, and every example of the
      manuscript; char-zero/lean/readme.md maps each label to its
      declarations. No characteristic-p theorem is claimed here. The
      manuscript text is private and is not included in this public
      repository; its full wording cannot currently be independently
      confirmed from a public source, and local agent fidelity review is not
      a substitute for public-source or author verification.
  - title: "The Stacks Project, Tags 0BMB, 0EYG and 0EYH"
    type: book
    identifier: "https://stacks.math.columbia.edu/tag/0BMB"
    relationship: background
    note: >
      Purity and Abhyankar inputs used in the substantive development.
      The compared statements do not take these results as hypotheses.

