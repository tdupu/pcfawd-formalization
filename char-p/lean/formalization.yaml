    author_endorsement: participated
    note: >
      Theorem thm:A, with Definitions def:prime-to-p, def:crit-branch,
      def:pcf and def:pcfawd-allsubvar, of the positive-characteristic
      manuscript by Dupuy, Tucker and Wang. The statement allows nonseparated
