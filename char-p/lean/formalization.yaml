# People, source authorship, and license are inherited from the parent project's
# recorded metadata (char-zero/lean/formalization.yaml), not newly asserted on
# behalf of a person by this session.
version: v0.4

project:
  name: "PCF on all subvarieties in any characteristic (Theorem A of paper-p)"
  description: |
    Theorem A (thm:A) of the manuscript "PCF all the way down: preperiodic
    subvarieties in any codimension, in any characteristic", in two cases:
    positive characteristic with monodromy not divisible by p, and
    characteristic zero with no monodromy premise.

    Hypotheses common to both selected theorems: k is a field; X is an
    integral, locally Noetherian scheme with Noetherian underlying space;
    s : X -> Spec k is locally of finite type; f : X -> X is finite and
    dominant (hence surjective). k and X live in the same universe. The
    endomorphism f need not be over k, and separatedness is not assumed. In
    PaperCharP.Palomar.theoremA_positiveCharacteristic, p is prime, k has
    characteristic p (CharP k p), and two premises are assumed:
    IsWeightedNormalizedPCF f and HasPrimeToPMonodromy p f. In
    PaperCharP.Palomar.theoremA_characteristicZero, k has characteristic zero
    (CharZero k) and the only premise is IsWeightedNormalizedPCF f. Both
    conclude IsPCFAllSubvarieties f.

    IsWeightedNormalizedPCF f: for every lift g of f to the normalization
    nu : X~ -> X (exactly one exists), the image under nu of the weighted
    post-critical set of g is finite. That set consists of the points
    g^[n+1](x), n >= 0, for codimension-one points x of X~ with
    delta_g(x) > 1, where delta_g(x) is the stalk ramification index of the
    maximal ideal of O_{X~,x} over O_{X~,g x} times the inseparable degree
    of the residue field extension kappa(g x) -> kappa(x). This is the
    paper's def:pcf with the normalized critical locus of def:crit-branch,
    with post-critical divisors counted on X.

    HasPrimeToPMonodromy p f: the stalk F of X at f(eta) (eta the generic
    point) is a field, the function field L of X is a finite separable
    F-algebra along the stalk map of f, and the normal closure of L/F
    inside an algebraic closure of L has F-dimension coprime to p
    (def:prime-to-p: separable, Galois closure of degree not divisible by p).

    IsPCFAllSubvarieties f (def:pcfawd-allsubvar), required at every finite
    depth d: at depth 0, f is separable and PCF, meaning generically
    separable (L separable over the stalk at f(eta) along the stalk map) and
    IsWeightedNormalizedPCF f. At depth d+1, f is separable and PCF, and for
    every point x other than the generic point (the generic point of a proper
    integral closed subvariety C), every r >= 0 and q >= 1 with
    f^[r+q] x = f^[r] x, every endomorphism h of the reduced closure of
    f^[r] x (the subvariety f^r(C)) with h followed by the closed immersion
    equal to the closed immersion followed by f^q satisfies the depth-d
    property. Returns are on the original, possibly nonnormal, subvarieties
    in every codimension.

    Two additional selected theorems,
    PaperCharP.Palomar.existsUnique_isNormalizationLift and
    PaperCharP.Palomar.exists_pointClosure_restriction, show that the
    quantified lift exists uniquely and the quantified restriction exists,
    so the definitions are nonvacuous; restriction uniqueness follows from
    the closed immersion being a monomorphism.

    The headline proofs apply PaperCharP.theoremA_positiveCharacteristic and
    PaperCharP.theoremA_characteristicZero of the project's main module
    through proved bridges (PaperCharPBridge.lean): the stated PCF,
    separability and monodromy predicates are proved equivalent to the
    development's, and the stated recursion is proved equivalent to the
    development's Pcf.IsPCFAllSubvarieties, transporting every restriction
    square to the development's actual return map.

    Does not claim. The theorem types carry hypotheses and instance
    arguments (listed above) that #print axioms cannot see; reporting only
    propext, Quot.sound and Classical.choice is not a claim that nothing is
    assumed. "Variety over k" is modelled by the scheme-theoretic conditions
    above, not by a separated geometrically integral variety, and f is not
    required to be a k-morphism; the structure map s enters only through
    these conditions. Ramification and inseparable degree are Mathlib's
    Ideal.ramificationIdx and Field.finInsepDegree at scheme points; they
    are identified with the paper's e(D/E) and [kappa:kappa]_insep only at
    codimension-one points of the normalization, where stalks are discrete
    valuation rings. The paper's divisor sets are represented by their
    generic points, and its recursion on dimension by quantification over
    every finite depth. The monodromy condition is stated with Mathlib's
    IntermediateField.normalClosure in AlgebraicClosure L, not with a
    monodromy group. The characteristic-zero theorem is stated separately:
    no version with p = 0 in HasPrimeToPMonodromy is selected. Nothing is
    claimed about the necessity of the monodromy hypothesis: the
    manuscript's examples (ex:wild, ex:frobenius-pinching,
    ex:monodromy-loss and others), Lemma lem:allsubvar-iterate, Theorem
    thm:allsubvar-pcfawd, the normalized blow-up argument and all other
    results of the manuscript are built by the project's main module or the
    shared library where formalized, but are not selected statements.
  authors:
    - Taylor Dupuy
    - Thomas Tucker
    - Zhuoran Wang
  license: Apache-2.0
  responsible_maintainers:
    - Taylor Dupuy

