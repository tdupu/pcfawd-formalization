version: v0.4

project:
  name: "PCF all the way down in characteristic zero, conditional on Zariski–Nagata purity and Abhyankar's lemma"
  # TODO(agent): this abstract was drafted from lean/README.md and
  # lean/HANDOFF.md §9.42, not from the elaborated type. Re-derive every clause
  # from `#check @Pcf.pcfAllTheWayDown_charZero` and the definitions restated
  # in PcfChallenge.lean before submission.
  description: |
    A Lean 4 / Mathlib formalization of the characteristic-zero case of the
    "PCF all the way down" theorem for finite self-maps of varieties.

    Let k be a field of characteristic zero, X an integral, locally Noetherian,
    Noetherian-space scheme locally of finite type over k, and f : X → X a
    finite dominant k-morphism that is post-critically finite in the normalized
    sense. The compared theorem `Pcf.pcfAllTheWayDown_charZero` concludes that
    f is PCF all the way down: at every finite recursion depth, the return maps
    induced on preperiodic integral effective divisors, and recursively on the
    divisors of those, are again post-critically finite in the normalized sense.

    The theorem is conditional. It takes as a hypothesis a structure
    `PcfAllTheWayDownLocalTheorems` whose two fields are universe-wide
    statements of Zariski–Nagata purity of the branch locus (Stacks Project Tag
    0BMB) and of Abhyankar's lemma (Stacks Project Tags 0EYG/0EYH). Neither is
    proved in this formalization. No other mathematical input is assumed: the
    normalization, the divisor lifts, the bounding theorem and the recursive
    assembly are all proved. The proof uses only the axioms propext,
    Classical.choice and Quot.sound.

    Separatedness, which the manuscript includes in "variety", is not used, so
    the formal statement is slightly more general there. At depth zero it
    restates the ambient PCF hypothesis.
  authors:
    # Confirmed by Taylor 2026-10-15: all four are authors of the formalization.
    - Taylor Dupuy
    - Alon Levy
    - Thomas Tucker
    - Zhuoran Wang
